<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PL Analytics
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/assets/css/base.css?v=2"
    >

    {% block styles %}
    {% endblock %}
    <link rel="stylesheet" href="/assets/css/global_search.css?v=2">
</head>


<body class="sport-{{ sport }}">

    <header class="site-header">

        <div class="site-header-inner">

            <a
                href="/"
                class="brand"
            >

                <div class="brand-mark">
                    PA
                </div>

                <div class="brand-text">

                    <span class="brand-name">
                        PL Analytics
                    </span>

                    <span class="brand-tagline">
                        sports data platform
                    </span>

                </div>

            </a>


            <nav class="main-navigation">

                <a
                    href="/"
                    class="navigation-link {% if active_page == 'scores' %}active{% endif %}"
                >
                    Scores
                </a>

                <span class="navigation-link disabled">
                    Teams
                </span>

                <span class="navigation-link disabled">
                    Predictions
                </span>

            </nav>


            <div class="header-actions">

                <button
                    id="global-search-button"
                    class="icon-button"
                    type="button"
                    aria-label="Search"
                    aria-haspopup="dialog"
                >
                    <span class="search-icon">
                    </span>

                    <span class="search-text">
                        Search
                    </span>
                </button>

                <button
                    class="account-button"
                    type="button"
                >
                    Sign in
                </button>

            </div>

        </div>

    </header>


    <nav class="sport-navigation">

        <div class="sport-navigation-inner">

            <a
                href="/"
                class="sport-navigation-link {% if active_page != 'trivia' %}active{% endif %}"
            >
                <span class="sport-dot">
                </span>

                Football
            </a>

            <a href="/trivia" class="sport-navigation-link {% if active_page == 'trivia' %}active{% endif %}">Trivia</a>

            <span class="sport-navigation-link disabled">
                Formula 1
            </span>

            <span class="sport-navigation-link disabled">
                Hockey
            </span>

            <span class="sport-navigation-link disabled">
                Tennis
            </span>

        </div>

    </nav>


    <main class="site-main">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="site-footer">

        <div class="site-footer-inner">

            <div>
                <strong>
                    PL Analytics
                </strong>

                <span>
                    sports data platform
                </span>
            </div>

            <span>
                Data, statistics and predictions
            </span>

        </div>

    </footer>


    <dialog id="global-search-overlay" class="global-search-overlay" aria-label="Search" data-entity-preview="disabled">
        <div class="global-search-dialog">
            <div class="global-search-input-row">
                <input id="global-search-input" class="global-search-input" type="search" aria-label="Search players, teams and competitions" placeholder="Players, teams, competitions" maxlength="100" autocomplete="off">
                <button id="global-search-close" class="global-search-close" type="button" aria-label="Close search" title="Close search">&times;</button>
            </div>
            <div id="global-search-content" class="global-search-content" aria-live="polite"></div>
        </div>
    </dialog>
    <script src="/assets/js/global_search.js?v=2" defer></script>

    {% block scripts %}
    {% endblock %}

<script
    src="/assets/js/disable_player_preview.js?v=1"
    defer
></script>

<script
    src="/assets/js/entity_preview.js?v=6"
    defer
></script>

</body>

</html>
